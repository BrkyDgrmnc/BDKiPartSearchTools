name: Build and Publish KiCad PCM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build official KiCad PCM package
        run: python build_pcm_package.py

      - name: Create GitHub Release with PCM ZIP and Submission Metadata
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/metadata-submission.json
          generate_release_notes: true
